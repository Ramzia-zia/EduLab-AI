<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulations – EduLab AI</title>
  <meta name="theme-color" content="#5B35D5">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/simulations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" data-sidebar aria-label="Menu"></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
    <div class="app-main">
      <header class="topbar" data-topbar></header>
      <main class="app-content" id="contenu" tabindex="-1">
        <header class="page-header">
          <div><h1>Simulations</h1><p id="result-count" aria-live="polite">Chargement…</p></div>
          <div class="search-box">
            <label for="search" class="sr-only">Rechercher une simulation</label>
            <input class="field__input" id="search" type="search" placeholder="Rechercher une simulation…" autocomplete="off">
          </div>
        </header>
        <div class="catalog-layout">
          <form class="card filters" id="filters" aria-label="Filtres">
            <fieldset><legend class="card__title">Matière</legend><div id="subject-filters" class="filter-list"></div></fieldset>
            <fieldset><legend class="card__title">Niveau</legend><div id="level-filters" class="filter-list"></div></fieldset>
            <button type="button" class="btn btn--secondary btn--sm" id="reset-filters">Réinitialiser</button>
          </form>
          <section aria-label="Résultats"><div id="catalog-grid" class="grid grid--3"></div></section>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/pages/simulations.js"></script>
</body>
</html>
