<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon suivi – EduLab AI</title>
  <meta name="theme-color" content="#5B35D5">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/progression.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" data-sidebar aria-label="Menu"></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
    <div class="app-main">
      <header class="topbar" data-topbar></header>
      <main class="app-content" id="contenu" tabindex="-1">
        <header class="page-header"><div><h1>Mon suivi</h1><p>Visualise ta progression et tes résultats.</p></div></header>
        <div id="progress-state" aria-live="polite"></div>
        <div id="progress-body" class="stack" hidden>
          <div class="grid grid--2">
            <section class="card chart progress-donut"><h2 class="card__title">Progression globale</h2><div id="donut" class="donut"></div></section>
            <section class="card chart"><h2 class="card__title">Résultats par matière</h2><div id="subject-chart"></div></section>
          </div>
          <section class="card chart"><h2 class="card__title">Évolution de mes résultats</h2><div id="evolution-chart"></div></section>
          <div class="grid grid--2">
            <section class="card"><h2 class="card__title">Simulations terminées</h2><ul id="completed-list" class="activity-list"></ul></section>
            <section class="card"><h2 class="card__title">Historique des activités</h2><div class="table-wrap"><table class="table"><caption class="sr-only">Historique</caption><thead><tr><th scope="col">Activité</th><th scope="col">Score</th><th scope="col">Date</th></tr></thead><tbody id="history-body"></tbody></table></div></section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/pages/progression.js"></script>
</body>
</html>
