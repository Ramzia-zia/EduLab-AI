<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communauté – EduLab AI</title>
  <meta name="theme-color" content="#5B35D5">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/communaute.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" data-sidebar aria-label="Menu"></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
    <div class="app-main">
      <header class="topbar" data-topbar></header>
      <main class="app-content" id="contenu" tabindex="-1">
        <header class="page-header">
          <div><h1>Communauté</h1><p>Pose des questions, partage tes conseils et réponds aux autres élèves.</p></div>
          <button type="button" class="btn btn--primary" id="new-post">Publier une question</button>
        </header>
        <div class="form-message form-message--info" data-community-note hidden></div>
        <div class="community-toolbar">
          <div class="tabs" role="tablist" aria-label="Catégories" id="category-tabs"></div>
          <div class="row">
            <div class="field"><label class="sr-only" for="post-search">Rechercher un sujet</label><input class="field__input" id="post-search" type="search" placeholder="Rechercher un sujet…" autocomplete="off"></div>
            <div class="field"><label class="sr-only" for="post-sort">Trier</label><select class="field__input" id="post-sort"><option value="recent">Plus récents</option><option value="popular">Plus appréciés</option></select></div>
          </div>
        </div>
        <div id="posts-state" aria-live="polite"></div>
        <ul id="posts-list" class="stack"></ul>
      </main>
    </div>
  </div>
  <script type="module" src="../js/pages/communaute.js"></script>
</body>
</html>
