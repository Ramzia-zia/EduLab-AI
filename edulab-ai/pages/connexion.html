<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – EduLab AI</title>
  <meta name="theme-color" content="#5B35D5">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/connexion.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="auth-header">
    <a class="brand" href="../index.html"><img src="../assets/images/logo.svg" alt="" width="36" height="36"><span>EduLab AI</span></a>
  </header>
  <main class="auth-main" id="contenu" tabindex="-1">
    <section class="card auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Connexion</h1>
      <p class="text-muted">Accédez à votre espace d’apprentissage</p>
      <div class="form-message form-message--info" data-demo-note hidden></div>
      <form id="login-form" class="stack" novalidate>
        <fieldset class="segmented">
          <legend class="sr-only">Je suis</legend>
          <label><input type="radio" name="role" value="student" checked><span>Élève</span></label>
          <label><input type="radio" name="role" value="teacher"><span>Enseignant</span></label>
        </fieldset>
        <div class="field">
          <label class="field__label" for="email">Adresse e-mail</label>
          <input class="field__input" id="email" name="email" type="email" placeholder="exemple@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label class="field__label" for="password">Mot de passe</label>
          <div class="input-group">
            <input class="field__input" id="password" name="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password">
            <button type="button" class="input-group__toggle" data-toggle-password="password" aria-label="Afficher le mot de passe" aria-pressed="false"></button>
          </div>
        </div>
        <div class="row row--between">
          <div class="field"><label class="checkbox"><input type="checkbox" name="remember"><span>Se souvenir de moi</span></label></div>
          <button type="button" class="link-button" id="forgot-link">Mot de passe oublié ?</button>
        </div>
        <div id="form-message" hidden></div>
        <button class="btn btn--primary btn--block" type="submit">Se connecter</button>
      </form>
      <div class="auth-divider"><span>Ou se connecter avec</span></div>
      <button class="btn btn--secondary btn--block" type="button" disabled aria-disabled="true">Google (bientôt disponible)</button>
      <p class="auth-switch text-small">Vous n’avez pas de compte ? <a href="inscription.html">Inscrivez-vous</a></p>
    </section>
  </main>
  <script type="module" src="../js/pages/connexion.js"></script>
</body>
</html>
