name: edulab_mobile
description: Application mobile des élèves d'EduLab AI (hors-ligne d'abord).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  supabase_flutter: ^2.6.0
  http: ^1.2.2
  uuid: ^4.5.0
  # À ajouter quand les paquets de l'équipe sont disponibles :
  #   labo_core:   path: ../packages/labo_core
  #   edulab_api:  path: ../packages/edulab_api   (client généré depuis openapi.json)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
