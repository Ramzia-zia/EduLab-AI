<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord – EduLab AI</title>
  <meta name="theme-color" content="#5B35D5">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" data-sidebar aria-label="Menu"></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
    <div class="app-main">
      <header class="topbar" data-topbar></header>
      <main class="app-content" id="contenu" tabindex="-1">
        <header class="page-header">
          <div><h1>Bonjour <span id="student-name">…</span></h1><p>Prêt(e) à explorer le monde des sciences ?</p></div>
        </header>
        <div id="dashboard-state" aria-live="polite"></div>
        <div id="dashboard-body" class="stack" hidden>
          <section class="grid grid--3" aria-label="Statistiques">
            <article class="card"><p class="stat-card__label">Mes progrès</p><p class="stat-card__value" id="stat-done">–</p><div class="progress" aria-hidden="true"><div class="progress__bar" id="stat-done-bar"></div></div><p class="text-muted text-small">expériences complétées</p></article>
            <article class="card"><p class="stat-card__label">Mon niveau</p><p class="stat-card__value text-success" id="stat-level">–</p><p class="text-muted text-small" id="stat-level-sub"></p></article>
            <article class="card"><p class="stat-card__label">Prochaine activité</p><p class="stat-card__value stat-card__value--small" id="stat-next">–</p><a class="btn btn--primary btn--sm" id="stat-next-link" href="simulations.html">Commencer</a></article>
          </section>
          <div class="dashboard-layout">
            <section class="card" aria-labelledby="subjects-title"><h2 class="card__title" id="subjects-title">Mes matières</h2><div class="grid grid--4" id="subjects-grid"></div></section>
            <aside class="card quote-card" aria-labelledby="quote-title"><h2 class="card__title" id="quote-title">Citation du jour</h2><blockquote id="quote-text"></blockquote></aside>
          </div>
          <section class="card" aria-labelledby="recent-title"><h2 class="card__title" id="recent-title">Activités récentes</h2><ul id="recent-list" class="activity-list"></ul></section>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/pages/dashboard.js"></script>
</body>
</html>
