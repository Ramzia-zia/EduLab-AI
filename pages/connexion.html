<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EduLab AI - Connexion</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; font-size: 1.5rem; font-weight: 800; color: var(--violet); margin-bottom: 24px;">🧪 EduLab AI</div>
      <h2>Connexion</h2>
      <div class="tabs">
        <div class="tab active">Élève</div>
        <div class="tab">Enseignant</div>
      </div>
      <form action="tableau-bord.html">
        <div class="form-group"><label>Adresse e-mail</label><input type="email" placeholder="exemple@email.com" required></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" placeholder="Votre mot de passe" required></div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem; color: var(--texte-gris);">
          <label><input type="checkbox"> Se souvenir de moi</label>
          <a href="#" style="color: var(--violet); font-weight: 600;">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
      </form>
      <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--texte-gris);">
        Pas de compte ? <a href="inscription.html" style="color: var(--violet); font-weight: 600;">Inscrivez-vous</a>
      </p>
    </div>
  </div>
</body>
</html>
