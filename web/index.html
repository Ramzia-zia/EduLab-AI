 <!DOCTYPE html>
<html lang="fr">
<head>

</head>
<body>
  <div id="app-root"></div>

  <script type="module">
    import { TitrationModel } from '/src/features/simulation/model/titration-model.js';

    const appRoot = document.getElementById('app-root');

    // ==========================================
    // 1. LES VUES DE L'APPLICATION
    // ==========================================
    const appViews = {
      accueil: `
        <div class="page-header"><h1>Bonjour Aminata 👋</h1><p>Prêt(e) à explorer le monde des sciences ?</p></div>
        <div class="grid-2">
          <div class="card"><h3>Mes progrès</h3><div class="big-stat">3/12</div><p class="stat-label">expériences complétées</p></div>

        </div>
        <h3 style="margin-top: 32px; margin-bottom: 16px;">Mes matières</h3>
        <div class="grid-4">
          <div class="subject-card" style="background: #E0F2FE;"><span>⚛️</span><h4>Physique</h4><p>5 expériences</p></div>
          <div class="subject-card" style="background: #F3E8FF;"><span>🧪</span><h4>Chimie</h4><p>7 expériences</p></div>
          <div class="subject-card" style="background: #DCFCE7;"><span>🌱</span><h4>SVT</h4><p>4 expériences</p></div>
          <div class="subject-card" style="background: #FCE7F3;"><span>📐</span><h4>Mathématiques</h4><p>3 expériences</p></div>
        </div>
      `,
      simulations: `
        <div class="page-header"><h1>Simulations - Chimie</h1><p>7 expériences disponibles</p></div>
        <div class="grid-3">
          <div class="card sim-card">
            <div class="sim-img" style="background: #F3E8FF;">🧪</div>
            <h4>Titrage acide-base</h4><p>Observer le changement de pH</p>
            <button class="btn-primary" data-link="simulation">Commencer</button>
          </div>
          <div class="card sim-card">
            <div class="sim-img" style="background: #E0F2FE;">🧪</div>
            <h4>Réaction de précipitation</h4><p>Comprendre la formation du précipité</p>
            <button class="btn-primary" disabled>Bientôt</button>
          </div>
          <div class="card sim-card">
            <div class="sim-img" style="background: #FCE7F3;">🔥</div>
            <h4>Combustion du méthane</h4><p>Étudier la réaction de combustion</p>
            <button class="btn-primary" disabled>Bientôt</button>
          </div>
        </div>
      `,
      simulation: `
        <div class="top-header">
          <button class="back-btn" data-link="simulations">← Retour aux simulations</button>
          <div class="user-profile">👤</div>
        </div>
        <div id="simulation-root"></div>
      `,
      cours: `
        <div class="page-header"><h1>Cours & Exercices - Chimie</h1><p>Terminale - Secondes</p></div>
        <div class="grid-2">
          <div class="card">
            <h3>Les réactions chimiques</h3>
            <p class="text-muted">Découvrez les différents types de réactions et leurs caractéristiques.</p>
            <button class="btn-primary" data-link="simulation">Lire le cours</button>
            <div class="progress-bar"><div class="progress" style="width: 60%;"></div></div>
          </div>
          <div class="card">
            <h3>Exercices recommandés</h3>
            <ul class="list-item">
              <li><span>Équilibrer une équation chimique</span> <span class="badge">10 min</span></li>
              <li><span>Identifier un gaz</span> <span class="badge">15 min</span></li>
              <li><span>Titrage acide-base</span> <span class="badge">20 min</span></li>
            </ul>
          </div>
        </div>
      `,
      assistant: `
        <div class="page-header"><h1>Assistant IA</h1><p>Posez vos questions sur les sciences</p></div>
        <div class="card chat-container">
          <div class="chat-message assistant"><strong>Assistant IA</strong><p>Bonjour ! Je suis là pour t'aider à comprendre tes expériences.</p></div>
          <div class="chat-message user"><p>Pourquoi la solution est devenue rose ?</p></div>
          <div class="chat-message assistant"><strong>Assistant IA</strong><p>La solution est devenue rose car tu as atteint le point d'équivalence.</p></div>
          <div class="chat-input"><input type="text" placeholder="Écris ton message..."><button class="btn-primary">Envoyer</button></div>
        </div>
      `,
      suivi: `
        <div class="page-header"><h1>Mon suivi</h1><p>Progression globale</p></div>
        <div class="grid-2">
          <div class="card" style="text-align: center;"><div class="big-stat">68%</div><p class="stat-label">Niveau global</p></div>
          <div class="card">
            <h3>Dernières activités</h3>
            <ul class="list-item">
              <li><span>Titrage acide-base</span> <span class="badge success">95%</span></li>
              <li><span>Réaction de précipitation</span> <span class="badge">80%</span></li>
            </ul>
          </div>
        </div>
      `,
      enseignant: `
        <div class="page-header"><h1>Espace enseignant</h1><p>Professeur de Physique-Chimie</p></div>
        <div class="grid-3">
          <div class="card"><div class="big-stat">2</div><p class="stat-label">Classes actives</p></div>
          <div class="card"><div class="big-stat">48</div><p class="stat-label">Élèves au total</p></div>
          <div class="card"><div class="big-stat" style="color: #EF4444;">8</div><p class="stat-label">En difficulté</p></div>
        </div>
      `,
      communaute: `<div class="page-header"><h1>Communauté</h1><p>Bientôt disponible</p></div>`,
      parametres: `<div class="page-header"><h1>Paramètres</h1><p>Bientôt disponible</p></div>`,
    };

    // ==========================================
    // 2. LES VUES D'AUTHENTIFICATION
    // ==========================================
    const authViews = {
      login: `
        <div class="auth-container">
          <div class="auth-card">
            <div class="auth-logo">🧪 EduLab AI</div>
            <h2>Connexion</h2>
            <p class="auth-subtitle">Accédez à votre espace d'apprentissage</p>
            <div class="auth-tabs"><button class="auth-tab active">Élève</button><button class="auth-tab">Enseignant</button></div>
            <div class="auth-form">
              <label>Adresse e-mail</label><input type="email" placeholder="exemple@email.com">
              <label>Mot de passe</label><input type="password" placeholder="Votre mot de passe">
              <div class="auth-options"><label><input type="checkbox"> Se souvenir de moi</label><a href="#">Mot de passe oublié ?</a></div>
              <button class="btn-primary btn-full" id="btn-login">Se connecter</button>
              <div class="auth-divider">Ou se connecter avec</div>
              <button class="btn-social">🔴 Se connecter avec Google</button>
              <p class="auth-footer">Vous n'avez pas de compte ? <a href="#" data-link="register">Inscrivez-vous</a></p>
            </div>
          </div>
        </div>
      `,
      register: `
        <div class="auth-container">
          <div class="auth-card">
            <div class="auth-logo">🧪 EduLab AI</div>
            <h2>Créer un compte</h2>
            <p class="auth-subtitle">Rejoignez EduLab AI et commencez vos parcours</p>
            <div class="auth-tabs"><button class="auth-tab active">Élève</button><button class="auth-tab">Enseignant</button></div>
            <div class="auth-form">
              <label>Adresse e-mail</label><input type="email" placeholder="exemple@email.com">
              <label>Mot de passe</label><input type="password" placeholder="Votre mot de passe">
              <label>Confirmer le mot de passe</label><input type="password" placeholder="Confirmer votre mot de passe">
              <button class="btn-primary btn-full" id="btn-register">S'inscrire</button>
              <p class="auth-footer">Vous avez déjà un compte ? <a href="#" data-link="login">Se connecter</a></p>
            </div>
          </div>
        </div>
      `
    };

    // ==========================================
    // 3. FONCTIONS DE RENDU
    // ==========================================
    function showAuthPage(pageName) { appRoot.innerHTML = authViews[pageName]; }

    function showApp(pageName) {
      appRoot.innerHTML = `
        <div class="app-layout">
          <aside class="sidebar">
            <div class="logo"><span class="logo-icon">🧪</span> EduLab AI</div>
            <nav id="main-nav">
              <a href="#" data-link="accueil">Accueil</a>
              <a href="#" data-link="simulations">Simulations</a>
              <a href="#" data-link="cours">Cours & Exercices</a>
              <a href="#" data-link="suivi">Mon suivi</a>
              <a href="#" data-link="assistant">Assistant IA</a>
              <a href="#" data-link="communaute">Communauté</a>
              <a href="#" data-link="parametres">Paramètres</a>
              <a href="#" data-link="enseignant">Espace enseignant</a>
              <a href="#" data-link="login" style="margin-top: 24px; color: #EF4444;">Déconnexion</a>
            </nav>
          </aside>
          <main class="main-content" id="main-content"></main>
        </div>
      `;

      const mainContent = document.getElementById('main-content');
      document.querySelectorAll('#main-nav a').forEach(link => {
        if (link.dataset.link === pageName) link.classList.add('active');
        else link.classList.remove('active');
      });

      if (appViews[pageName]) { mainContent.innerHTML = appViews[pageName]; }
      else { mainContent.innerHTML = `<div class="page-header"><h1>Page introuvable</h1></div>`; }

      if (pageName === 'simulation') { initTitrationSimulation(); }
    }

    // ==========================================
    // 4. LE MOTEUR DE TITRAGE AVEC DESSIN AMÉLIORÉ
    // ==========================================
    function initTitrationSimulation() {
      const root = document.getElementById('simulation-root');
      if (!root) return;

      root.innerHTML = `
        <div class="simulation-layout">
          <div class="canvas-area">
            <!-- Le canvas de dessin -->
            <canvas id="stage" width="400" height="500"></canvas>
          </div>
          <div class="control-panel">
            <h2 class="panel-title">Titrage acide-base</h2>
            <div class="card"><h3>Matériel</h3><ul class="material-list"><li>Burette</li><li>Érienmeyer</li><li>Solution acide</li><li>Solution basique</li><li>Indicateur coloré</li></ul></div>
            <div class="card"><h3>Étapes</h3><ol class="steps-list"><li>Ajouter la solution acide</li><li>Ajouter l'indicateur</li><li>Verser la solution basique</li><li>Observer le changement de couleur</li></ol></div>
            <div class="card">
              <div class="ph-header"><span>pH actuel</span><span id="ph-value" class="ph-value">1.00</span></div>
              <div class="ph-bar"><div class="ph-indicator" id="ph-indicator" style="left: 7%;"></div></div>
            </div>
            <div class="card">
              <div class="volume-header"><span>Volume versé</span><span id="volume-value" class="volume-value">0.0 mL</span></div>
              <input type="range" id="volume-slider" min="0" max="40" step="0.1" value="0">
            </div>
            <button id="btn-continue" class="btn-continue">Continuer l'expérience</button>
          </div>
        </div>
      `;

      const params = { acidConcentration: 0.1, initialAcidVolume: 20.0, baseConcentration: 0.1, indicatorName: 'phenolphtaleine' };
      const model = new TitrationModel(params);
      const stage = document.getElementById('stage');
      const ctx = stage.getContext('2d');
      const phValueEl = document.getElementById('ph-value');
      const phIndicator = document.getElementById('ph-indicator');
      const volumeValueEl = document.getElementById('volume-value');
      const slider = document.getElementById('volume-slider');
      const btnContinue = document.getElementById('btn-continue');

      // --- DESSIN DES INSTRUMENTS (BURETTE ET ERLENMEYER) ---
      function drawInstruments(volume, ph) {
        ctx.clearRect(0, 0, 400, 500);

        // 1. BURETTE (Verre transparent avec reflets)
        // Corps de la burette (fond blanc/bleuté)
        ctx.fillStyle = 'rgba(230, 235, 245, 0.6)';
        ctx.fillRect(180, 40, 40, 180);
        // Contour de la burette
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2;
        ctx.strokeRect(180, 40, 40, 180);
        // Reflet sur le verre
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(185, 45, 5, 170);
        
        // Robinet de la burette
        ctx.fillStyle = '#64748B';
        ctx.fillRect(190, 220, 20, 15);
        ctx.beginPath(); ctx.arc(200, 235, 8, 0, Math.PI, false); ctx.fill();

        // Goutte (si on verse)
        if (volume > 0 && volume < 40) {
          ctx.fillStyle = '#6D28D9'; // Couleur violette de la marque
          ctx.beginPath(); ctx.ellipse(200, 260, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
        }

        // 2. ERLENMEYER (Fiole conique)
        ctx.beginPath();
        ctx.moveTo(150, 330); // Goulot gauche
        ctx.lineTo(250, 330); // Goulot droit
        ctx.lineTo(220, 440); // Base droite
        ctx.lineTo(180, 440); // Base gauche
        ctx.closePath();

        // Couleur du liquide
        let liquidColor = '#F8FAFC'; // Transparent par défaut
        if (ph >= 8.2 && ph <= 10) {
          const t = (ph - 8.2) / 1.8;
          liquidColor = `rgba(${Math.round(244 - (244-109)*t)}, ${Math.round(114 + (40-114)*t)}, ${Math.round(182 + (217-182)*t)}, 0.8)`;
        } else if (ph > 10) {
          liquidColor = 'rgba(236, 72, 153, 0.8)'; // Rose vif
        }
        
        // Remplissage du liquide
        ctx.fillStyle = liquidColor;
        ctx.fill();
        
        // Contour de l'Erlenmeyer
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 3;
        ctx.stroke();

        // Reflet sur le verre de l'Erlenmeyer
        ctx.beginPath();
        ctx.moveTo(160, 340);
        ctx.lineTo(195, 435);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 4;
        ctx.stroke();

        // 3. ETIQUETTE / GRADUATION
        ctx.fillStyle = '#64748B';
        ctx.font = '12px Inter';
        ctx.fillText('Burette', 230, 100);
        ctx.fillText('Érienmeyer', 230, 390);
      }

      function update() {
        const volume = parseFloat(slider.value);
        model.reset(); model.addBase(volume);
        const ph = model.ph;

        // Mise à jour des textes
        phValueEl.textContent = ph.toFixed(2);
        volumeValueEl.textContent = volume.toFixed(1) + ' mL';
        phIndicator.style.left = (ph / 14) * 100 + '%';
        phIndicator.style.backgroundColor = ph < 7 ? '#EF4444' : ph < 8.2 ? '#F59E0B' : '#3B82F6';

        // Dessin des instruments
        drawInstruments(volume, ph);
      }

      slider.addEventListener('input', update);
      btnContinue.addEventListener('click', () => {
        alert('Expérience terminée ! Redirection vers ton suivi.');
        showApp('suivi');
      });
      
      // Premier rendu
      update();
    }

    // ==========================================
    // 5. GESTIONNAIRE DE CLIC GLOBAL (ROUTER)
    // ==========================================
    document.body.addEventListener('click', (e) => {
      const link = e.target.closest('[data-link]');
      if (link) {
        e.preventDefault();
        const page = link.dataset.link;
        if (page === 'login' || page === 'register') { showAuthPage(page); } 
        else { showApp(page); }
      }
    });

    document.body.addEventListener('click', (e) => {
      if (e.target.id === 'btn-login' || e.target.id === 'btn-register') {
        e.preventDefault();
        showApp('accueil');
      }
    });

    // ==========================================
    // 6. DÉMARRAGE
    // ==========================================
    showAuthPage('login');

  </script>
</body>
</html>
